name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new thread
        2. Switch to Codex
        3. ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude, Codex, Both, Not agent-related]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Open Agent 0.2.0, Windows 11, claude 2.x / codex 0.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any private paths, code, or tokens first.
