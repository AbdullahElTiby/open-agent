[package]
name = "open-agent"
version = "0.1.0"
description = "Open Agent — a personal AI coding agent powered by Claude Code and Codex"
edition = "2021"

[lib]
name = "open_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
